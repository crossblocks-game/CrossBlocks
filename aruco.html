<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrossBlocks — Base ArUco</title>
<style>
body{margin:0;background:#090c10;color:#e6edf3;font:14px Arial}.wrap{max-width:1000px;margin:auto;padding:20px}
.box{background:#12161c;border:1px solid #30363d;border-radius:10px;padding:18px;margin-top:15px}
input,select,button{padding:10px;border-radius:6px;border:1px solid #394451;background:#0d1117;color:#fff}
button{cursor:pointer;background:#202832}.row{display:grid;grid-template-columns:180px 1fr auto;gap:10px}
.item{padding:10px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;gap:10px}
</style></head><body><div class="wrap">
<a href="index.html" style="color:#fff">‹ CrossBlocks</a>
<h1>📷 Base ArUco</h1>
<div class="box"><p>Associe n'importe quel ID ArUco à une unité déjà présente dans la base CrossBlocks.</p>
<div class="row"><input id="id" type="number" min="0" placeholder="ID ArUco"><select id="unit"></select><button id="save">Associer</button></div></div>
<div class="box"><h2>Associations</h2><div id="list">Chargement…</div></div>
</div>
<script src="crossblocks-scan-data.js"></script><script>
let db;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{
 try{
  db=await CrossBlocksAruco.fetchDB();
  const units=CrossBlocksAruco.allUnits(db);
  $('unit').innerHTML=units.map(u=>'<option>'+esc(CrossBlocksAruco.unitName(u))+'</option>').join('');
  render();
 }catch(e){$('list').textContent='Base inaccessible.'}
})();
function render(){
 const a=db.aruco||{};
 $('list').innerHTML=Object.keys(a).sort((x,y)=>Number(x)-Number(y)).map(id=>
 '<div class="item"><span><b>ArUco #'+esc(id)+'</b> → '+esc(a[id].unitName)+'</span>'+
 '<button onclick="del('+Number(id)+')">Supprimer</button></div>'
 ).join('')||'Aucune association.';
}
$('save').onclick=async()=>{
 const id=Number($('id').value);
 const unit=$('unit').value;
 if(!Number.isInteger(id)||id<0||!unit)return alert('ID et unité requis.');
 db.aruco=db.aruco||{};
 db.aruco[String(id)]={unitName:unit,updatedAt:new Date().toISOString()};
 alert('Association enregistrée dans cette session. Pour la synchroniser, utilise l’enregistrement ArUco de ton panneau Admin.');
 render();
};
window.del=id=>{delete db.aruco[String(id)];render()};
</script></body></html>
