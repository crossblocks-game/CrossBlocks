<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrossBlocks — Fiche</title>
<style>body{margin:0;background:#090c10;color:#e6edf3;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:20px}a{color:#fff;background:#202832;border:1px solid #394451;border-radius:7px;padding:9px 13px;text-decoration:none}.card{margin-top:16px;background:#12161c;border:1px solid #30363d;border-radius:12px;padding:20px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat,.w{background:#0d1117;padding:12px;border-radius:7px;text-align:center}.stat b{display:block;font-size:24px}.weapon{border:1px solid #30363d;border-radius:8px;padding:12px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.warn{padding:12px;background:#211b08;border:1px solid #9e6a03;border-radius:7px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class="wrap"><a href="scan-figurine.html">📷 Scanner</a> <a href="index.html">‹ CrossBlocks</a><div class="card" id="card">Chargement…</div></div>
<script src="./crossblocks-scan-data.js"></script><script>
(async function(){
 const card=document.getElementById('card'),id=new URLSearchParams(location.search).get('id');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 if(id===null){card.innerHTML='<h1>Fiche inconnue</h1>';return}
 try{
  const db=await CrossBlocksAruco.fetchDB(),map=CrossBlocksAruco.getMapping(db,id);
  if(!map){card.innerHTML='<h1>ArUco #'+esc(id)+'</h1><div class="warn">Marqueur reconnu, mais aucune figurine ne lui est associée.</div>';return}
  const u=CrossBlocksAruco.getUnitByAruco(db,id);
  if(!u){card.innerHTML='<h1>ArUco #'+esc(id)+'</h1><div class="warn">Association trouvée, mais unité introuvable : '+esc(map.unitName)+'</div>';return}
  const n=u.name||u.n||'Figurine',f=u.faction||'',pts=u.basePts??u.pts??u.points??0,pv=u.hp??u.pv??0,pa=u.pa??u.actions??5,mm=u.mm??u.move??0,arm=u.arm??u.armor??0,ws=u.weapons||[];
  let h='<small>ARUCO #'+esc(id)+'</small><h1>'+esc(n)+'</h1><p>'+esc(f)+' · '+pts+' points</p><div class="stats"><div class="stat"><b>'+pv+'</b>PV</div><div class="stat"><b>'+pa+'</b>Actions</div><div class="stat"><b>'+mm+'</b>MM</div><div class="stat"><b>'+arm+'+</b>Armure</div><div class="stat"><b>'+pts+'</b>Points</div></div><h2>Armes</h2>';
  h+=ws.length?ws.map(w=>{if(typeof w==='string')w={name:w};return '<div class="weapon"><h3>'+esc(w.n||w.name||'Arme')+'</h3><div class="grid"><div class="w"><b>'+esc(w.mun??w.touches??'—')+'</b><br>Touches/Munitions</div><div class="w"><b>'+esc(w.melee??'—')+'</b><br>Mêlée</div><div class="w"><b>'+esc(w.cat1??w.range1??'—')+'</b><br>Portée 1</div><div class="w"><b>'+esc(w.cat2??w.range2??'—')+'</b><br>Portée 2</div><div class="w"><b>'+esc(w.catP??w.rangePlus??'—')+'</b><br>Portée +</div><div class="w"><b>+'+esc(w.pen??w.penetration??0)+'</b><br>Pénétration</div><div class="w"><b>'+esc(w.dMax??w.dmg??w.damage??'—')+'</b><br>Dégâts</div><div class="w"><b>'+esc(w.effect||'—')+'</b><br>Effet</div></div></div>'}).join(''):'<p>Aucune arme renseignée.</p>';
  h+='<h2>Compétences / règles spéciales</h2><p>'+esc(u.abilities||u.special||u.rule||'Aucune')+'</p>';card.innerHTML=h;
 }catch(e){console.error(e);card.innerHTML='<h1>Erreur de chargement</h1><div class="warn">La base CrossBlocks est inaccessible.</div>'}
})();
</script></body></html>
