<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CrossBlocks — Fiche figurine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e11;
    --panel: #12161c;
    --panel-2: #171c23;
    --border: #262c35;
    --text: #e8ecef;
    --muted: #7c8793;
    --accent: #4cff8b;
    --warn: #ffb347;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Rajdhani', sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 18px 60px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0 20px;
  }
  .brand { font-weight: 700; letter-spacing: 0.02em; font-size: 1rem; }
  .brand small { display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
  a.link {
    color: var(--muted); text-decoration: none; font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem; border: 1px solid var(--border); border-radius: 6px; padding: 7px 11px;
  }
  a.link:hover { border-color: var(--accent); color: var(--accent); }

  /* --- Dossier card --- */
  .dossier {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .dossier-head {
    display: flex; align-items: center; gap: 16px;
    padding: 22px 22px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  .emblem {
    width: 68px; height: 68px; flex: none;
    border: 1px solid var(--border); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.1rem; background: var(--bg);
  }
  .titles h1 { margin: 0; font-size: 1.5rem; line-height: 1.15; }
  .titles .faction {
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px;
  }
  .points-badge {
    margin-left: auto; text-align: right; font-family: 'JetBrains Mono', monospace;
    color: var(--warn); font-size: 0.78rem; white-space: nowrap;
  }
  .points-badge b { display: block; font-size: 1.3rem; color: var(--warn); }

  /* --- Stat grid --- */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--border);
  }
  .stat {
    background: var(--panel); padding: 16px 14px; text-align: center;
  }
  .stat .val { font-family: 'JetBrains Mono', monospace; font-size: 1.7rem; font-weight: 600; color: var(--accent); }
  .stat .val.low { color: var(--danger); }
  .stat .label { font-size: 0.78rem; color: var(--muted); margin-top: 2px; letter-spacing: 0.02em; }

  /* --- Sections --- */
  section.block { padding: 20px 22px; border-top: 1px solid var(--border); }
  section.block h2 {
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 12px;
  }

  .armure-row {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 1.05rem;
  }
  .armure-row .val { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 600; }

  .weapon {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px; background: var(--panel-2);
  }
  .weapon:last-child { margin-bottom: 0; }
  .weapon-name { font-weight: 600; font-size: 1.02rem; margin-bottom: 6px; }
  .weapon-stats {
    display: flex; flex-wrap: wrap; gap: 10px 18px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--muted);
  }
  .weapon-stats span b { color: var(--text); font-weight: 600; }
  .weapon-special {
    margin-top: 8px; font-size: 0.85rem; color: var(--warn);
    font-style: italic;
  }

  ul.competences { margin: 0; padding-left: 20px; }
  ul.competences li { margin-bottom: 6px; line-height: 1.4; }

  .empty {
    text-align: center; padding: 80px 20px; color: var(--muted);
  }
  .empty .code { font-family: 'JetBrains Mono', monospace; color: var(--danger); margin-bottom: 10px; }
  .empty a.link { display: inline-block; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">CROSSBLOCKS<small>FICHE DE FIGURINE</small></div>
    <a class="link" href="scan-figurine.html">↻ Nouveau scan</a>
  </header>

  <div id="content"></div>
</div>

<script src="crossblocks-scan-data.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const arucoId = params.get('id');
  const content = document.getElementById('content');

  const figurine = arucoId !== null ? getFigurineByArucoId(arucoId) : null;

  if (!figurine) {
    content.innerHTML = `
      <div class="empty">
        <div class="code">${arucoId === null ? 'AUCUN ID FOURNI' : 'MARQUEUR #' + escapeHtml(arucoId) + ' INCONNU'}</div>
        <p>Cette figurine n'est pas (encore) dans le catalogue.</p>
        <a class="link" href="scan-figurine.html">‹ Retour au scanner</a>
      </div>`;
    return;
  }

  document.title = 'CrossBlocks — ' + figurine.nom;

  const pvLow = figurine.pv <= 2;

  content.innerHTML = `
    <div class="dossier">
      <div class="dossier-head">
        <div class="emblem">${figurine.emoji || '⬢'}</div>
        <div class="titles">
          <h1>${escapeHtml(figurine.nom)}</h1>
          <div class="faction">${escapeHtml(figurine.faction || '')}</div>
        </div>
        <div class="points-badge">
          <b>${figurine.points ?? '—'}</b>
          points
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="val ${pvLow ? 'low' : ''}">${figurine.pv ?? '—'}</div>
          <div class="label">PV</div>
        </div>
        <div class="stat">
          <div class="val">${figurine.pa ?? '—'}</div>
          <div class="label">Actions (PA)</div>
        </div>
        <div class="stat">
          <div class="val">${figurine.mm ?? '—'}</div>
          <div class="label">Mouvement max</div>
        </div>
      </div>

      <section class="block">
        <h2>Armure</h2>
        <div class="armure-row">
          <span>${escapeHtml(figurine.armure?.nom || 'Aucune')}</span>
          <span class="val">${figurine.armure?.valeur ?? '—'}</span>
        </div>
      </section>

      <section class="block">
        <h2>Armes</h2>
        ${(figurine.armes || []).map(renderWeapon).join('') || '<p style="color:var(--muted)">Aucune arme équipée.</p>'}
      </section>

      ${figurine.competences && figurine.competences.length ? `
      <section class="block">
        <h2>Compétences &amp; actions spéciales</h2>
        <ul class="competences">
          ${figurine.competences.map((c) => `<li>${escapeHtml(c)}</li>`).join('')}
        </ul>
      </section>` : ''}
    </div>
  `;

  function renderWeapon(arme) {
    return `
      <div class="weapon">
        <div class="weapon-name">${escapeHtml(arme.nom)}</div>
        <div class="weapon-stats">
          <span>Dégâts <b>${arme.degats ?? '—'}</b></span>
          <span>Portée <b>${arme.portee ?? '—'}</b></span>
          <span>Cadence <b>${escapeHtml(arme.cadence || '—')}</b></span>
        </div>
        ${arme.special ? `<div class="weapon-special">${escapeHtml(arme.special)}</div>` : ''}
      </div>`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
})();
</script>
</body>
</html>
